name: Publish Static Registry

on:
  push:
    branches:
      - main
    paths:
      - "plugins/**"
      - "index.json"
      - "schemas/**"
      - "scripts/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/publish-registry.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "publish-registry"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ZEUS_REGISTRY_OUTPUT_DIR: dist/registry
      ZEUS_REGISTRY_BASE_URL: ${{ vars.ZEUS_PLUGIN_REGISTRY_BASE_URL }}
      ZEUS_REGISTRY_PRIVATE_KEY: ${{ secrets.ZEUS_REGISTRY_SIGNING_PRIVATE_KEY }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Validate registry
        run: |
          zeus plugin check . --registry --json
          python -m unittest tests.test_validation tests.test_publish

      - name: Ensure signing key exists
        run: |
          if [ -z "${ZEUS_REGISTRY_PRIVATE_KEY:-}" ]; then
            echo "Missing ZEUS_REGISTRY_SIGNING_PRIVATE_KEY GitHub secret" >&2
            exit 1
          fi

      - name: Publish static registry
        run: ./scripts/publish_registry.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/registry

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
