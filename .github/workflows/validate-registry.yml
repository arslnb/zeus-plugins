name: Validate Registry

on:
  pull_request:
    paths:
      - "plugins/**"
      - "index.json"
      - "schemas/**"
      - "scripts/**"
      - "src/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Validate plugin registry
        run: |
          zeus plugin check . --registry --json
          python -m unittest tests.test_validation tests.test_publish
