[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeus-plugins-repo"
version = "0.1.0"
description = "Zeus plugin registry repository with scaffold and validation CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.21.1"
]

[project.scripts]
zeus = "zeus_plugins.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
